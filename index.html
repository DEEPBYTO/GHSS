<script>
(function () {
  'use strict';
  var base = (window.location.pathname.indexOf('/Academics/') !== -1) ? '../' : './';

  fetch(base + 'index.html')
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');

      var h = doc.querySelector('[data-shared-header]');
      var hh = document.getElementById('site-header');
      if (h && hh) hh.innerHTML = h.outerHTML;

      var f = doc.querySelector('[data-shared-footer]');
      var fh = document.getElementById('site-footer');
      if (f && fh) fh.innerHTML = f.outerHTML;

      initNavbar();
    })
    .catch(function (err) { console.warn('Shared load:', err); });

  function initNavbar() {
    var navbar = document.getElementById('navbar');
    var navToggle = document.getElementById('navToggle');
    var navLinks = document.getElementById('navLinks');
    if (!navbar || !navToggle || !navLinks) return;
    window.addEventListener('scroll', function () {
      if (window.scrollY > 20) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    });
    navToggle.addEventListener('click', function () {
      var isOpen = navLinks.classList.toggle('open');
      navToggle.classList.toggle('active');
      navToggle.setAttribute('aria-expanded', isOpen);
    });
    navLinks.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        navLinks.classList.remove('open');
        navToggle.classList.remove('active');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }
})();
</script>
